[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyze-video-joiner"
version = "1.1.1"
description = "Join short Wyze camera clips into longer videos"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "enonymous1" }]
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
audio = ["numpy>=1.26", "matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
wyze-join = "wyze_joiner.cli:main"
wyze-join-gui = "wyze_joiner.gui:main"
wyze-audio = "wyze_joiner.audio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wyze_joiner = ["*.qss", "*.png"]

[tool.pytest.ini_options]
# Only this repo's own tests, wherever pytest is invoked from inside it.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

# PyQt6's own stubs are not mypy-parseable (they use `*args, /`, a
# positional-only marker after var-args, which is invalid syntax), and
# mypy reaches them through matplotlib -> PIL.ImageQt whenever the gui
# extra is installed — even when checking audio.py, which never imports
# Qt itself. Skipping PyQt6 itself does NOT fix this: mypy still parses
# its stub to build the interface. Skipping the parent, PIL.ImageQt,
# does: mypy never follows ImageQt's (function-body) Qt imports, so it
# never opens the unparseable stub. The GUI is already excluded from
# the mypy gate (see CI); this keeps the gate about our code.
[[tool.mypy.overrides]]
module = "PIL.ImageQt"
follow_imports = "skip"
