[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyze-video-joiner"
version = "1.0.0"
description = "Join short Wyze camera clips into longer videos"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "enonymous1" }]
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
wyze-join = "wyze_joiner.cli:main"
wyze-join-gui = "wyze_joiner.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wyze_joiner = ["*.qss", "*.png"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
